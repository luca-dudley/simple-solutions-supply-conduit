name: Lint & Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  python-ingestion:
    name: Test & Lint Ingestion Microservice
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r services/ingestion/requirements.txt
          pip install pytest ruff

      - name: Run Ruff Lint
        run: |
          ruff check services/ingestion

      - name: Run Pytest
        env:
          SUPABASE_URL: "http://localhost:54321"
          SUPABASE_SERVICE_ROLE_KEY: "dummy_key"
          WHATSAPP_API_TOKEN: "dummy_token"
          WHATSAPP_APP_SECRET: "dummy_secret"
          WHATSAPP_PHONE_NUMBER_ID: "123456"
          WHATSAPP_VERIFY_TOKEN: "test_token"
          LLM_API_KEY: "dummy_llm_key"
        run: |
          cd services/ingestion
          pytest

  web-app:
    name: Build & Lint Web App
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        working-directory: apps/web
        run: npm ci

      - name: Lint Next.js
        working-directory: apps/web
        run: npm run lint

      - name: TypeScript Type Check
        working-directory: apps/web
        run: npx tsc --noEmit
